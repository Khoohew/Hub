name: Family app checks
on:
  push:
    branches: [main]
    paths:
      - "apps/family/**"
      - ".github/workflows/family-app-check.yml"
  pull_request:
    paths:
      - "apps/family/**"
      - ".github/workflows/family-app-check.yml"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find apps/family/src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --experimental-default-type=module --check < "$file"
          done
      - name: Test attachment encryption
        run: node --experimental-default-type=module --test apps/family/tests/attachment-crypto.test.mjs
