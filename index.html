<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>個人工作台</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--line:#26334a;--text:#eef3fb;--muted:#9aa9bf;--accent:#9fc2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#1b3150,transparent 42%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}main{max-width:1100px;margin:auto;padding:clamp(22px,5vw,60px)}h1{font-size:clamp(28px,5vw,42px);margin:0}header{margin-bottom:32px}header p{color:var(--muted)}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.app{display:block;text-align:left;font:inherit;text-decoration:none;color:inherit;background:linear-gradient(145deg,#1a2941,#131b2b);border:1px solid var(--line);border-radius:18px;padding:23px;transition:.16s;cursor:pointer}.app:hover{border-color:#6785b5;transform:translateY(-2px)}.icon{width:48px;height:48px;border-radius:15px;background:#273d5c;display:grid;place-items:center;font-size:24px;margin-bottom:18px}.app h2{font-size:19px;margin:0 0 7px}.app p,footer{color:var(--muted);font-size:14px}.go{display:inline-block;color:var(--accent);font-size:13px;margin-top:18px}footer{margin-top:42px}.overlay{position:fixed;inset:0;background:#050912df;z-index:10;display:grid;place-items:center;padding:16px}.hidden{display:none!important}.dialog{width:min(440px,100%);background:#151f32;border:1px solid #34445e;border-radius:18px;padding:23px;box-shadow:0 20px 70px #0008}.dialog h2{margin:0 0 7px;font-size:21px}.dialog p{font-size:13px;color:var(--muted)}label{display:block;font-size:13px;margin:18px 0 7px}.field{width:100%;padding:12px;border:1px solid #40516c;border-radius:10px;background:#0d1524;color:var(--text);font:inherit;outline:none}.field:focus{border-color:var(--accent)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.btn{border:1px solid #35445d;border-radius:9px;padding:10px 15px;background:#1a263b;color:var(--text);font:inherit;cursor:pointer}.btn.primary{background:var(--accent);color:#142033;border-color:var(--accent);font-weight:700}.hint{font-size:11px!important;color:#c5b98f!important;margin-top:13px}.login-row{display:flex;gap:9px;margin-top:16px;align-items:stretch}.login-row .field{min-width:0;flex:1}.login-row .btn{white-space:nowrap}.app.device-app{cursor:default}.app.device-app:hover{transform:none}.device-note{font-size:11px!important;margin:10px 0 0!important}
</style></head><body><main><header><h1>個人工作台</h1><p>常用工具與個人項目入口</p></header><section class="apps">
<section class="app device-app"><div class="icon">▣</div><h2>設備管理</h2><p>記錄設備、購買價格、使用狀態與每日持有成本。</p><form id="loginForm"><label for="accessToken">存取密鑰</label><div class="login-row"><input class="field" id="accessToken" type="password" autocomplete="off" placeholder="貼上 GitHub Fine-grained Token" required><button class="btn primary" type="submit">進入 →</button></div></form><p class="device-note">密鑰僅暫時用於登入，不會寫入網址或永久瀏覽器儲存空間。</p></section>
<a class="app" href="./apps/gallery/"><div class="icon">▧</div><h2>AI HTML 畫廊</h2><p>瀏覽私人動畫庫中的 HTML 作品。</p><span class="go">開啟畫廊 →</span></a>
</section><footer>Personal Hub · 個人工具入口，資料由各項目自行管理</footer></main>
<script>
const input=document.getElementById("accessToken");
document.getElementById("loginForm").addEventListener("submit",e=>{
  e.preventDefault();
  const value=input.value.trim();
  if(!value)return;
  window.name="PD_MANAGER_TOKEN:"+value;
  location.href="./apps/devices/";
});
</script></body></html>
