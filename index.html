<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>個人工作台</title><style>:root{color-scheme:dark;--bg:#0b1020;--line:#26334a;--text:#eef3fb;--muted:#9aa9bf;--accent:#9fc2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#1b3150,transparent 42%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}main{max-width:1100px;margin:auto;padding:clamp(22px,5vw,60px)}h1{font-size:clamp(28px,5vw,42px);margin:0}header{margin-bottom:32px}header p{color:var(--muted)}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.app{display:block;text-decoration:none;color:inherit;background:linear-gradient(145deg,#1a2941,#131b2b);border:1px solid var(--line);border-radius:18px;padding:23px}.app:hover{border-color:#6785b5}.icon{width:48px;height:48px;border-radius:15px;background:#273d5c;display:grid;place-items:center;font-size:24px;margin-bottom:18px}.app h2{font-size:19px;margin:0 0 7px}.app p,footer{color:var(--muted);font-size:14px}.go{display:inline-block;color:var(--accent);font-size:13px;margin-top:18px}footer{margin-top:42px}</style></head><body><main><header><h1>個人工作台</h1><p>常用工具與個人項目入口</p></header><section class="apps"><a class="app" href="./apps/devices/"><div class="icon">▣</div><h2>設備管理</h2><p>記錄設備、購買價格、使用狀態與每日持有成本。</p><span class="go">開啟工具 →</span></a><a class="app" href="./apps/gallery/"><div class="icon">▧</div><h2>AI HTML 畫廊</h2><p>瀏覽私人動畫庫中的 HTML 作品。</p><span class="go">開啟畫廊 →</span></a></section><footer>Personal Hub · 個人工具入口，資料由各項目自行管理</footer></main></body></html>
