<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<link rel="icon" type="image/svg+xml" href="./icon.svg?v=3">
<link rel="apple-touch-icon" href="./icon.svg?v=3">
<link rel="manifest" href="./manifest.webmanifest?v=3">
<title>個人工作台</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151f32;--panel2:#1a2941;--line:#2b3a53;--text:#eef3fb;--muted:#9aa9bf;--accent:#a8c8ff;--danger:#ffb4b4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#1b3150,transparent 42%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
main{width:min(100% - 36px,1050px);margin:0 auto;padding:clamp(24px,5vw,58px) 0 42px}
header{margin-bottom:25px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:0}
header p{margin:10px 0 0;color:var(--muted)}
.access-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px;margin:0 0 20px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#151f32,#111a2a);box-shadow:0 8px 24px #0002}
.tokenbar,.repo-picker{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0;margin:0}
.tokenbar label,.repo-picker label{display:block;font-size:14px;color:#d8e2f0;white-space:nowrap}
.field{display:block;width:100%;max-width:none;min-width:0;padding:10px 12px;border:1px solid #40516c;border-radius:9px;background:#0d1524;color:var(--text);font:inherit;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9fc2ff20}
.tokenbar .field,.repo-picker .field{width:100%;flex:1 1 auto}
.repo-picker .field{cursor:pointer;font-size:14px}
.error{font-size:12px;color:var(--danger);min-height:0;margin:0 0 12px}
@media(max-width:650px){.access-panel{grid-template-columns:1fr;gap:11px;padding:12px}.tokenbar label,.repo-picker label{font-size:13px}}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.app-card{min-width:0;display:flex;flex-direction:column;align-items:flex-start;background:linear-gradient(145deg,#1a2941,#131b2b);border:1px solid var(--line);border-radius:18px;padding:23px}
.icon{width:48px;height:48px;border-radius:15px;background:#273d5c;display:grid;place-items:center;font-size:24px;margin-bottom:17px}
.app-card h2{font-size:19px;margin:0 0 7px}
.app-card p{flex:1;color:var(--muted);font-size:14px;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border:1px solid #35445d;border-radius:10px;padding:9px 16px;background:#1a263b;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:#6785b5}
.btn.primary{background:var(--accent);color:#142033;border-color:var(--accent);font-weight:700}
footer{margin-top:34px;color:#8594aa;font-size:12px;text-align:center}
@media(max-width:650px){main{width:min(100% - 28px,1050px);padding-top:25px}.apps{grid-template-columns:1fr}.app-card{padding:19px}.app-card p{margin-bottom:16px}.btn{width:100%}}
</style>
</head>
<body>
<main>
<header>
  <h1>個人工作台</h1>
  <p>常用工具與個人項目入口</p>
</header>

<section class="access-panel" aria-label="GitHub 存取與專案入口">
  <div class="tokenbar">
    <label for="accessToken">GitHub 存取密鑰</label>
    <input class="field" id="accessToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" />
  </div>
  <div class="repo-picker">
    <label for="repoSelect">GitHub 專案</label>
    <select class="field" id="repoSelect" aria-label="選擇要開啟的 GitHub 專案">
      <option value="">選擇專案，直接開啟…</option>
      <optgroup label="電腦">
        <option value="https://github.com/ChewchewHan/Android_Signin_Assistant_points">安卓手機簽到助手</option>
        <option value="https://github.com/ChewchewHan/RemoteMac">Windows 遠端控制 Mac（公開）</option>
        <option value="https://github.com/ChewchewHan/Blender_Batch_Renderer">Blender 批次渲染器</option>
        <option value="https://github.com/ChewchewHan/Blender_Remote_Monitor">Blender 遠端監控</option>
        <option value="https://github.com/ChewchewHan/Oracle-Monitor">Oracle 伺服器監控</option>
      </optgroup>
      <optgroup label="Chrome">
        <option value="https://github.com/ChewchewHan/VJshi-keyword-helper">VJ師素材關鍵字助手</option>
        <option value="https://github.com/ChewchewHan/Multi-Stock-Auto-Fill">VJ師素材多平台填表助手</option>
        <option value="https://github.com/ChewchewHan/VCG-Title-Keyword-Assistant">視覺中國標題與關鍵字助手</option>
        <option value="https://github.com/ChewchewHan/VCG-Rejected-Asset-Organizer">視覺中國未採納素材整理</option>
        <option value="https://github.com/ChewchewHan/Chatgpt-claude-batch-image-helper">ChatGPT／Claude 批量生圖助手</option>
      </optgroup>
      <optgroup label="個人專案與資料庫">
        <option value="https://github.com/ChewchewHan/AI-Skills">AI 技能與工作流程</option>
        <option value="https://github.com/ChewchewHan/HomeStudy">家庭 AI 學習系統</option>
        <option value="https://github.com/ChewchewHan/Shanxi-Ancient-Architecture">山西古建檔案庫（公開）</option>
        <option value="https://github.com/ChewchewHan/AI-HTML-Archive">AI HTML 動畫收藏庫</option>
        <option value="https://github.com/ChewchewHan/Personal-Device-Manager">個人設備資料庫</option>
        <option value="https://github.com/ChewchewHan/Hub">個人工作台（公開）</option>
        <option value="https://github.com/ChewchewHan/VCG">視覺中國客戶查詢（廢棄）（公開）</option>
      </optgroup>
      <optgroup label="安卓">
        <option value="https://github.com/ChewchewHan/Android-English-Project">英語學習專案</option>
      </optgroup>
    </select>
  </div>
</section>
<p class="error" id="accessError" role="status" aria-live="polite"></p>

<section class="apps" aria-label="功能模組">
  <article class="app-card">
    <div class="icon" aria-hidden="true">▣</div>
    <h2>設備管理</h2>
    <p>記錄設備、購買價格、使用狀態、出售收入與每日持有成本。</p>
    <button class="btn primary" type="button" data-target="devices">進入設備管理 →</button>
  </article>

  <article class="app-card">
    <div class="icon" aria-hidden="true">▧</div>
    <h2>AI HTML 畫廊</h2>
    <p>瀏覽私人動畫庫中的 HTML 作品，搜尋分類並播放動畫預覽。</p>
    <button class="btn primary" type="button" data-target="gallery">進入 AI HTML 畫廊 →</button>
  </article>
</section>

<footer>Personal Hub · 個人工具入口，資料由各項目自行管理</footer>
</main>
<script>
"use strict";
const tokenInput=document.getElementById("accessToken");
const error=document.getElementById("accessError");
const repoSelect=document.getElementById("repoSelect");
repoSelect.addEventListener("change",()=>{
  const url=repoSelect.value;
  if(!url)return;
  window.open(url,"_blank","noopener,noreferrer");
  repoSelect.value="";
});
document.querySelectorAll("[data-target]").forEach(button=>{
  button.addEventListener("click",()=>{
    const value=tokenInput.value.trim();
    if(!value){
      error.textContent="請先在上方輸入共用存取密鑰。";
      tokenInput.focus();
      return;
    }
    error.textContent="";
    window.name="PD_MANAGER_TOKEN:"+value;
    const target=button.dataset.target;
    location.href=(target==="gallery"?"./apps/gallery/":"./apps/devices/")+"?v="+(target==="gallery"?"20261111i":"20261111r");
  });
});
tokenInput.addEventListener("input",()=>{error.textContent="";});
</script>
</body>
</html>
